<!DOCTYPE html>
<html lang="pt-br"> 
    <head> 
        <title>Conteúdo Aula03 - HTML</title>
    </head>
    <body>

        <h3>Atributos em HTML</h3>

        <p> Utilizando o atributo href:</p>

        <a href="https://www.w3schools.com">Clique aqui</a>

        <hr>

        <p> Utilizando os atributos src, width, height e alt:</p>

        <img src="car.jpg" width="300" height="300" alt="Chevrolet Opala 1972">

        <hr>

        <p>Utilizando o atributo style:</p>

        <p style="color: purple;">Esse texto é Roxo</p>

    </body>

</html>
