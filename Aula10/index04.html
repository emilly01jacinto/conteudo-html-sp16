<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Conteúdo Aula10 - HTML</title>

</head>
<body>

    <h1>Listas no HTML</h1>

    <h3>Exemplo de lista Não Ordenada no HTML</h3>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>

    <hr>

    <h3>Exemplo de Lista Ordenada</h3>

    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ol>

    <hr>

    <h3>Exemplo de Lista Descritiva no HTML</h3>

    <d1>
        <dt>Carro</dt>
        <dd>Possui 4 rodas</dd>
        <br>
        <dt>Moto</dt>
        <dd>Veículo que possuí 2 rodas.</dd>
    </d1>

</body>
</html>
